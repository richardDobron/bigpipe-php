on:
    push:
    pull_request:
name: CI
jobs:
    phpunit:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.0', '8.1', '8.2', '8.3', '8.4']
        name: PHP ${{ matrix.php }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup php
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}

            - name: Composer install
              run: composer install --no-interaction --ansi --no-progress --optimize-autoloader

            - name: Check style
              if: matrix.php == '8.3'
              run: composer check-style

            - name: Execute unit tests
              run: composer test
